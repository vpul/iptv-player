name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  # The weekly Refresh channels run commits with GITHUB_TOKEN, which does not
  # trigger `push` workflows (GitHub recursion prevention) — pick it up here.
  workflow_run:
    workflows: ["Refresh channels"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          force_orphan: true
